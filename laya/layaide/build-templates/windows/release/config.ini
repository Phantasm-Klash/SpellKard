; SpellKard Windows native runtime config.
; This file lives in `build-templates/windows/release/`, which the LayaAir IDE
; merges into the published Windows client directory (next to LayaBox.exe).
; It is the same file as <support-package>/project/resource/config.ini with
; LoadExtension enabled and the desktop window sized for the 960x720 stage.
[common]
JSDebugPort=5959
JSDebugMode=0
GraphicsAPI=WebGL #comment OpenGLES|WebGL|ModernAPIs
LoadExtension=true #comment true|false
[android]
UseSwappy=true
[desktop]
AppId=com.phantasmklash.spellkard
WindowMode=WindowResizable #comment Window|WindowResizable|FullScreen
ShowDebugConsole=false #comment true|false
RunInBackground=false
width=960
height=720
[waterMark]
Enabled=false
BackgroundColor='#000000'
Image=image/splash.png
FitMode=Center #comment Contain|Cover|Fill|Center
Duration=1500 #ms
PositionX=0.5 #comment Horizontal position percentage (0.0-1.0, 0.5 = 50%)
PositionY=0.3 #comment Vertical position percentage (0.0-1.0, 0.3 = 30% from top)
[Render]
EnableShaderBinaryCache=true
VSync=true
[modernAPIs]
AutoThreading=true
ComputePoolSize=4
AsyncRecording=3
AsyncRecordingThreads=2
MaxBufferedFrames=2
