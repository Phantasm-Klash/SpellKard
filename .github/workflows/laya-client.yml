name: Laya Client CI

# Typecheck, test, ide-check and build the LayaAir 3 TypeScript client
# (laya/**). The existing protocol-audit workflow only covers godot/** and
# tools/**, so laya changes previously triggered no CI at all. The browser
# build mirrors the local gate: tsconfig.browser.json turns on noUnusedLocals,
# which the typecheck/test configs do not cover.

on:
  push:
    branches: [main]
    paths:
      - "laya/**"
      - ".github/workflows/laya-client.yml"
  pull_request:
    paths:
      - "laya/**"
      - ".github/workflows/laya-client.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: laya

jobs:
  laya-typecheck-test:
    name: npm ci + typecheck + test + ide:check + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: laya/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: IDE project check
        run: npm run ide:check

      - name: Build (browser)
        run: npm run build

  server-parity:
    name: C++ ↔ TS 运动学对拍
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout client
        uses: actions/checkout@v4

      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: Phantasm-Klash/PhK-BattleServer
          path: PhK-BattleServer

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build the server-side diff runner
        run: |
          set -euo pipefail
          cmake -S PhK-BattleServer -B PhK-BattleServer/build -G Ninja
          cmake --build PhK-BattleServer/build --target phk_motion_diff

      - name: Install client dependencies
        working-directory: laya
        run: npm ci

      - name: Compile the client mirror
        working-directory: laya
        run: npx tsc -p tsconfig.test.json

      - name: Compare every tick of every scenario
        env:
          BUILD_DIR: ${{ github.workspace }}/PhK-BattleServer/build
          SK_DIR: ${{ github.workspace }}
        run: bash PhK-BattleServer/tools/tna_coverage/run_parity.sh

      - name: Delta wire acceptance (real danmaku trace)
        env:
          BUILD_DIR: ${{ github.workspace }}/PhK-BattleServer/build
          SK_DIR: ${{ github.workspace }}
        run: bash PhK-BattleServer/tools/tna_coverage/run_delta_acceptance.sh
